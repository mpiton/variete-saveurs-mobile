# ARCHI §8 — 5 blocking gates on the Linux host. No Android build in CI:
# the APK is built locally, where the keystore lives.
# Third-party actions are SHA-pinned and gate tools version-pinned
# (CLAUDE.md §Sécurité supply chain); bump SHAs and versions together.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # wry/webkit2gtk-sys need these to compile the host-side dioxus build
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Gate scoped to domain/ (CLAUDE.md §Couverture) — ui/platform/main/tests excluded.
      - name: Coverage (domain ≥ 85%)
        run: |
          cargo llvm-cov --locked --fail-under-lines 85 \
            --ignore-filename-regex 'src/(ui|platform)/|src/main\.rs|tests/'

      - name: Audit (RustSec advisories)
        run: cargo audit

      - name: Deny (licenses, advisories, bans, sources)
        run: cargo deny check
