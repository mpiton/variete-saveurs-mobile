# cargo-deny — supply-chain gates (CLAUDE.md §Sécurité supply chain, ARCHI §8 step 5).

[graph]
# Only what we actually compile: the phone target and the Linux host (CI + dev tests).
targets = ["aarch64-linux-android", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
# Vulnerabilities always block. Unmaintained blocks on our direct deps only — the
# dioxus/wry transitive tree (gtk3-rs, fxhash, paste…) is theirs to fix, not ours.
unmaintained = "workspace"

# Two `unsound` advisories show up as Dependabot alerts on the GitHub repo. Both
# are held by dioxus 0.7.9 — `cargo update --precise` is refused — and neither
# reaches the phone. Deliberately NOT added to `ignore`: if RustSec ever
# reclassifies one as a vulnerability, it must break the build rather than stay
# silently suppressed. Recheck when dioxus moves.
#
# RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g — glib 0.18.5, VariantStrIter.
#   muda/tray-icon → gtk ^0.18. Host target only: nothing on
#   `cargo tree --target aarch64-linux-android`, so it is not in the APK.
# RUSTSEC-2026-0097 / GHSA-cq8v-f236-94qc — rand 0.7.3, unsound with a custom
#   logger calling `rand::rng()`. wry → kuchikiki → selectors → phf_codegen,
#   a [build-dependencies] edge: perfect-hash codegen at build time, not linked.

[licenses]
# devis-mobile itself is a private app (publish = false), no license required.
private = { ignore = true }
# Exactly the licenses observed in the tree (cargo deny list) — extend only on purpose.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # webpki-roots 1.x (Mozilla root store data, pulled by reqwest's
    # rustls-tls — task 26 Brevo client).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# ponytail: dioxus' tree carries many duplicate versions — warn, don't block; tighten later if it matters
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Citationberg revision patched to require quick-xml 0.41 for RUSTSEC-2026-0194/0195.
allow-git = ["https://github.com/typst/citationberg"]
