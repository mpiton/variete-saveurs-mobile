[package]
name = "devis-mobile"
version = "0.2.1"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
dioxus = { version = "0.7.9", features = ["mobile", "router"] }
html-escape = "0.2.14"
image = { version = "0.25", default-features = false, features = ["png"] }
# Held at 0.12: 0.13 drops the webpki-roots feature for rustls-platform-verifier,
# which on Android reads the device trust store and needs JNI init at startup.
# `rustls-tls` here keeps the roots baked into the APK (platform/mail.rs).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }
typst = "0.15.1"
typst-pdf = "0.15.1"

[target.'cfg(target_os = "android")'.dependencies]
# Held at 0.21 to match dioxus/tao/wry, which all link the same JNI bindings.
# Move when they do; 0.22 alone would just add a second copy to the APK.
jni = "0.21.1"
ndk-context = "0.1.1"

[patch.crates-io]
# Upstream security fix for RUSTSEC-2026-0194/0195, pending a Citationberg release.
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }

[profile.release]
strip = "symbols"

[dev-dependencies]
tempfile = "3.27.0"
